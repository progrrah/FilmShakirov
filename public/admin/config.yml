backend:
  name: test-repo
  branch: main  # Укажите вашу ветку (main/master)

media_folder: "static/images"  # Папка для загрузки изображений
public_folder: "/images"      # Путь от корня сайта

collections:
  - name: "posts"             # Название коллекции (например, посты)
    label: "Posts"            # Название в интерфейсе
    folder: "content/posts"   # Путь к Markdown-файлам
    create: true              # Разрешить создание новых записей
    slug: "{{slug}}"          # Формат имени файла
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "draft", label: "Draft", widget: "boolean", default: false }
      - { name: "body", label: "Content", widget: "markdown" }